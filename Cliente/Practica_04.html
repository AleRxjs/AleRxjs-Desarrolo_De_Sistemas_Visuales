<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout clásico</title>
    <link rel="stylesheet" href="estilos_2.css">
</head>
<body>

<div class="container">

  <header class="header">
    <div class="h-left">20%×100%</div>
    <div class="h-right">80%×100%</div>
  </header>

  <nav class="nav">
    <div>25%×100%</div>
    <div>25%×100%</div>
    <div>25%×100%</div>
    <div>25%×100%</div>
  </nav>

  <main class="main">
    <aside class="aside">
      25%×100%
    </aside>

    <section class="content">
      <div class="content-top">
        100%×40%
      </div>

      <div class="content-bottom">
        <div>50%×100%</div>
        <div>50%×100%</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div>50%×100%</div>
    <div>25%×100%</div>
    <div>25%×100%</div>
  </footer>

</div>

</body>
</html>
